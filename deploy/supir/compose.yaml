services:
  supir-worker:
    build:
      context: ../..
      dockerfile: deploy/supir/Dockerfile
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      - ${SUPIR_MODELS_DIR:-./models}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8010/health'))['ready']"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20m